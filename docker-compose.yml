version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_seplag
    environment:
      POSTGRES_DB: seplagdb
      POSTGRES_USER: seplag
      POSTGRES_PASSWORD: seplag123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
